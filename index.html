<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="description" content="The North – A Journey. Štyri dni, štyri príbehy.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
  <title>The North – A Journey</title>
</head>
<body>
  <main class="app-shell">
    <section id="welcome-view" class="welcome-view">
      <div class="welcome-content">
        <p class="welcome-description">Štyri dni na severe Anglicka. Príbehy miest, železníc, futbalu a ľudí, ktorí formovali ich podobu. Objavuj ich postupne, deň po dni.</p>
        <button id="continue-button" class="continue-button" type="button">Pokračovať <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="route-intro-view" class="route-intro-view" hidden aria-live="polite">
      <div class="route-intro-top"><span class="eyebrow" id="route-day-label"></span><button id="route-skip" class="back-link" type="button">Preskočiť animáciu →</button></div>
      <div class="route-intro-content"><p class="route-kicker">DNEŠNÁ CESTA</p><h1 id="route-title"></h1><p id="route-subtitle" class="route-subtitle"></p><div id="route-scene-heading" class="route-scene-heading"></div><div id="route-map-stage" class="route-map-stage"></div><div id="route-steps" class="route-steps"></div><button id="route-continue" class="continue-button route-continue" type="button" hidden>Pokračovať <span aria-hidden="true">→</span></button></div>
    </section>

    <section id="days-view" class="navigation-view" hidden>
      <div class="section-masthead">THE NORTH <span>/</span> A JOURNEY</div>
      <h1 class="index-heading">Sever,<br>postupne.</h1>
      <p class="index-deck">Príbehy sa otvárajú deň po dni.</p>
      <div id="days-list" class="list-view"></div>
      <button id="days-back" class="back-link" type="button">← Späť</button>
    </section>

    <section id="chapters-view" class="navigation-view" hidden>
      <button id="chapters-back" class="back-link" type="button">← Dni</button>
      <h1 id="day-heading" class="day-heading"></h1>
      <div id="day-chapters" class="list-view"></div>
    </section>

    <section class="reading-panel" id="reading-panel" hidden>
      <div class="reading-top">
        <span class="eyebrow" id="reading-day"></span>
        <span class="reading-time" id="reading-time"></span>
        <button id="back-button" class="back-link" type="button">← Kapitoly</button>
      </div>
      <article>
        <h1 id="reading-title"></h1>
        <p class="reading-deck" id="reading-deck"></p>
        <div class="reading-visual" id="reading-visual"></div>
        <div class="article-body" id="reading-body"></div>
        <div class="closing-note"><p id="reading-curiosity"></p></div>
      </article>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
